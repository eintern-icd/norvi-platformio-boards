[platformio]
boards_dir = ../../boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.variants_dir = ../../variants
lib_deps =
  lovyan03/LovyanGFX
  adafruit/RTClib
  arduino-libraries/Ethernet
  fbiego/CST816S

[env:norvi_x1]
board = norvi_x1
board_build.variant = norvi_x1

[env:norvi_x2]
board = norvi_x2
board_build.variant = norvi_x2

[env:norvi_x3]
board = norvi_x3
board_build.variant = norvi_x3

[env:norvi_xn]
board = norvi_xn
board_build.variant = norvi_xn

[env:norvi_x1_n16r8]
board = norvi_x1_n16r8
board_build.variant = norvi_x1